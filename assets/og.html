<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  background:#0B0B0E;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  padding:74px 78px;display:flex;flex-direction:column;justify-content:space-between;
}
.top{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(180deg,#4A4A52,#1E1E22);display:grid;place-items:center}
.mark svg{width:22px;height:22px}
h1{font-size:92px;line-height:.92;letter-spacing:-.045em;font-weight:800;max-width:15ch}
h1 em{font-style:normal;color:#FF2E3C}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
p{font-size:23px;line-height:1.45;color:#8D8D98;max-width:34ch}
.chip{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#0B0B0E;background:#FF2E3C;padding:11px 20px;border-radius:99px;white-space:nowrap;font-weight:600}
.bar{position:absolute;left:0;right:0;bottom:0;height:9px;background:rgba(255,255,255,.09)}
.bar i{display:block;height:100%;width:68%;background:#FF2E3C}
